  <script>
    const cover = document.getElementById('game-cover');
    const ph = document.getElementById('cover-placeholder');
    function sync() {
      const hasSrc = cover.getAttribute('src') && cover.getAttribute('src').trim() !== '';
      ph.style.display = hasSrc ? 'none' : 'flex';
      cover.style.display = hasSrc ? 'block' : 'none';
    }
    cover.addEventListener('load', sync);
    cover.addEventListener('error', () => { ph.style.display='flex'; cover.style.display='none'; });
    sync();
