<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omkarlohar.me</title>
  </head>
  <body class="bg-white">
    <div class="w-full relative bg-white">
      <div data-barba="wrapper" class="w-full relative">
        <div
          class="loading-container fixed inset-0 z-[999] overflow-hidden pointer-events-none"
        >
          <div
            class="loading-screen relative w-full h-full top-full bg-black [will-change:top]"
          >
            <div
              class="rounded-div-wrap top absolute left-0 top-0 w-full h-0 overflow-hidden [will-change:height] -translate-y-full -scale-y-100"
            >
              <div
                class="rounded-div absolute top-0 left-1/2 w-[150%] h-[745%] rounded-full -translate-x-1/2 translate-y-[-86.666%] bg-black"
              ></div>
            </div>
            <div
              class="rounded-div-wrap bottom absolute left-0 bottom-0 w-full h-0 overflow-hidden [will-change:height] translate-y-full"
            >
              <div
                class="rounded-div absolute top-0 left-1/2 w-[150%] h-[745%] rounded-full -translate-x-1/2 translate-y-[-86.666%] bg-black"
              ></div>
            </div>
            <div
              class="loading-words absolute top-1/2 left-1/2 w-full -translate-x-1/2 -translate-y-1/2 opacity-0 [will-change:opacity] z-[3]"
            >
              <h2
                class="greeting greeting-first absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden opacity-100"
              >
                Hello
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Bonjour
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Hola
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Ciao
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Olá
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                こんにちは
              </h2>
              <!-- <h2 class="greeting">Hallå</h2> -->
              <!-- <h2 class="greeting">Guten tag</h2> -->
              <!-- <h2 class="greeting">வணக்கம்</h2>
              <h2 class="greeting">నమస్కారం</h2> -->
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                നമസ്കാരം
              </h2>
              <!-- <h2 class="greeting">নমস্কাৰ</h2> -->
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                ನಮಸ್ಕಾರ
              </h2>
              <h2
                class="greeting-last absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                नमस्कार
              </h2>
              <h2
                class="page-word absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap block"
              ></h2>
            </div>
          </div>
        </div>
        <div data-barba="container" data-barba-namespace="home" class="w-full">
          <div data-scroll-container>
            <header
              class="home-header relative min-h-[115vh] max-[720px]:min-h-[110vh] max-[720px]:max-h-[110vh] flex items-center bg-black overflow-hidden"
              data-scroll-section
            >
              <div
                class="personal-image absolute top-[-10%] max-[720px]:top-[-5%] left-0 w-full h-[110%] max-[720px]:h-[105%] bg-black"
                data-scroll
                data-scroll-speed="-3"
                data-scroll-position="top"
              >
                <picture>
                  <source media="(max-width: 720px)" srcset="/assets/setup_2.jpg" />
                  <img
                    class="w-auto max-[720px]:w-full h-full object-cover absolute left-1/2 -translate-x-1/2"
                    src="/assets/setup_1.jpg"
                    alt="My setup"
                  />
                </picture>
              </div>
              <div
                class="big-name absolute bottom-[15vh] max-[720px]:bottom-[33vh] left-0 w-full pb-[clamp(1.875em,5vw,3.125em)]"
              >
                <div
                  class="name-h1 relative flex w-full"
                  data-scroll
                  data-scroll-direction="horizontal"
                  data-scroll-speed="4"
                  data-scroll-position="top"
                >
                  <div class="name-wrap relative flex items-center">
                    <h1
                      class="no-select relative flex items-center text-white leading-none text-[max(9em,15vw)] whitespace-nowrap pointer-events-none m-0 p-0 [text-shadow:4px_4px_20px_rgba(0,0,0,0.5)]"
                    >
                      This is my setup<span class="spacer px-[3vw]">—</span>
                    </h1>
                  </div>
                </div>
              </div>
            </header>
            <section
              data-scroll-section
              class="bg-white w-full min-h-screen flex flex-col items-center justify-center gap-8 px-4 text-center"
            >
              <h2
                class="text-black text-3xl sm:text-5xl font-semibold max-w-2xl"
              >
                Want to see what I've been building?
              </h2>
              <a
                href="/projects/"
                class="px-6 py-3 rounded-full text-lg text-black border border-gray-700 hover:border-gray-500 transition-colors duration-300"
              >
                View My Projects
              </a>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
