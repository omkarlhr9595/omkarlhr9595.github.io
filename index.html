<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omkarlohar.me</title>
    <script type="module" crossorigin src="/assets/main-op8S-srt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-DErCOOYj.css">
  </head>
  <body class="bg-white">
    <div class="w-full relative bg-white">
      <div data-barba="wrapper" class="w-full relative">
        <div
          class="loading-container fixed inset-0 z-[999] overflow-hidden pointer-events-none"
        >
          <div
            class="loading-screen relative w-full h-full top-full bg-black [will-change:top]"
          >
            <div
              class="rounded-div-wrap top absolute left-0 top-0 w-full h-0 overflow-hidden [will-change:height] -translate-y-full -scale-y-100"
            >
              <div
                class="rounded-div absolute top-0 left-1/2 w-[150%] h-[745%] rounded-full -translate-x-1/2 translate-y-[-86.666%] bg-black"
              ></div>
            </div>
            <div
              class="rounded-div-wrap bottom absolute left-0 bottom-0 w-full h-0 overflow-hidden [will-change:height] translate-y-full"
            >
              <div
                class="rounded-div absolute top-0 left-1/2 w-[150%] h-[745%] rounded-full -translate-x-1/2 translate-y-[-86.666%] bg-black"
              ></div>
            </div>
            <div
              class="loading-words absolute top-1/2 left-1/2 w-full -translate-x-1/2 -translate-y-1/2 opacity-0 [will-change:opacity] z-[3]"
            >
              <h2
                class="greeting greeting-first absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden opacity-100"
              >
                Hello
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Bonjour
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Hola
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Ciao
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                Olá
              </h2>
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                こんにちは
              </h2>
              <!-- <h2 class="greeting">Hallå</h2> -->
              <!-- <h2 class="greeting">Guten tag</h2> -->
              <!-- <h2 class="greeting">வணக்கம்</h2>
              <h2 class="greeting">నమస్కారం</h2> -->
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                നമസ്കാരം
              </h2>
              <!-- <h2 class="greeting">নমস্কাৰ</h2> -->
              <h2
                class="greeting absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                ನಮಸ್ಕಾರ
              </h2>
              <h2
                class="greeting-last absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap hidden"
              >
                नमस्कार
              </h2>
              <h2
                class="page-word absolute top-0 left-0 w-full m-0 text-white font-greeting font-medium text-[clamp(1.75rem,4vw,3rem)] text-center whitespace-nowrap block"
              ></h2>
            </div>
          </div>
        </div>
        <div data-barba="container" data-barba-namespace="home" class="w-full">
          <div data-nav-overlay></div>
          <div data-scroll-container>
            <header
              class="home-header relative min-h-[115vh] max-[720px]:min-h-[110vh] max-[720px]:max-h-[110vh] flex items-center bg-black overflow-hidden"
              data-scroll-section
            >
              <div class="absolute left-0 top-0 z-20 w-full" data-nav-bar></div>
              <div
                class="personal-image once-in absolute top-[-10%] max-[720px]:top-[-5%] left-0 w-full h-[110%] max-[720px]:h-[105%] bg-black [will-change:transform]"
                data-scroll
                data-scroll-speed="-3"
                data-scroll-position="top"
              >
                <picture>
                  <source
                    media="(max-width: 720px)"
                    srcset="/assets/setup_2.png"
                  />
                  <img
                    class="w-auto max-[720px]:w-full h-full object-cover absolute left-1/2 -translate-x-1/2"
                    src="/assets/setup_1.png"
                    alt="My setup"
                  />
                </picture>
              </div>
              <div
                class="big-name absolute bottom-[15vh] max-[720px]:bottom-[33vh] left-0 w-full pb-[clamp(1.875em,5vw,3.125em)]"
              >
                <div
                  class="name-h1 relative flex w-full"
                  data-scroll
                  data-scroll-direction="horizontal"
                  data-scroll-speed="4"
                  data-scroll-position="top"
                >
                  <div class="name-wrap relative flex items-center">
                    <h1
                      class="no-select once-in relative flex items-center font-heading font-semibold text-white leading-none text-[max(9em,15vw)] whitespace-nowrap pointer-events-none m-0 p-0 [text-shadow:4px_4px_20px_rgba(0,0,0,0.5)] [will-change:transform]"
                    >
                      This is my setup<span class="spacer px-[3vw]">—</span>
                    </h1>
                  </div>
                </div>
              </div>
            </header>
            <section
              data-scroll-section
              class="bg-white w-full min-h-screen flex items-center justify-center px-3 py-6 sm:p-10 lg:p-16"
            >
              <!-- The aspect ratio lives on the wrapper, not on the loaded image:
                   Locomotive measures section offsets once at init, so a box that
                   only gets its height once the SVG lands leaves those offsets
                   stale and sections get flagged out-of-view. -->
              <div
                class="relative w-[min(100%,1800px,calc(66vh*1.6356))] aspect-[772/472]"
              >
                <img
                  src="/assets/desk-mat.svg"
                  alt=""
                  aria-hidden="true"
                  class="absolute inset-0 block h-full w-full select-none pointer-events-none drop-shadow-[0_25px_50px_rgba(0,0,0,0.28)]"
                />
                <div class="absolute inset-0 overflow-hidden" data-draggable-layer>
                  <!-- Position and tilt are randomised per load in
                       initDraggables(); add more items by copying this block. -->
                  <div class="draggable absolute w-12 sm:w-16 md:w-20 select-none">
                    <img
                      src="/assets/coke.png"
                      alt=""
                      draggable="false"
                      class="draggable-image block w-full h-full touch-none cursor-grab active:cursor-grabbing"
                    />
                    <div
                      class="group/rotate absolute bottom-0 right-0 h-1/4 w-1/4"
                    >
                      <button
                        type="button"
                        aria-label="Rotate"
                        class="draggable-rotate absolute -bottom-1.5 -right-1.5 flex h-5 w-5 items-center justify-center rounded-full border border-black/10 bg-white/90 text-[#184536] opacity-0 shadow transition-opacity duration-150 touch-none cursor-grab group-hover/rotate:opacity-100 focus-visible:opacity-100 active:cursor-grabbing active:opacity-100"
                      >
                        <svg
                          viewBox="0 0 16 16"
                          class="h-3 w-3"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                        >
                          <path
                            d="M12.5 8a4.5 4.5 0 1 1-1.5-3.354"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                          <path
                            d="M11 2v3h-3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div
                  class="pointer-events-none absolute inset-0 flex items-center justify-center px-[10%]"
                  data-ransom-title
                >
                  <img
                    data-letter="D"
                    alt="D"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="e"
                    alt="e"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <img
                    data-letter="s"
                    alt="s"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <img
                    data-letter="k"
                    alt="k"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <span class="w-[3%] shrink-0" aria-hidden="true"></span>
                  <img
                    data-letter="S"
                    alt="S"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="e"
                    alt="e"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <img
                    data-letter="t"
                    alt="t"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <img
                    data-letter="u"
                    alt="u"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                  <img
                    data-letter="p"
                    alt="p"
                    class="ransom-letter aspect-square flex-1 min-w-0 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)] -ml-[2%]"
                  />
                </div>
                <span class="sr-only">Desk Setup</span>
                <button
                  type="button"
                  aria-label="Shuffle letters and stickers"
                  data-ransom-shuffle
                  class="absolute -bottom-14 right-0 flex h-10 w-10 items-center justify-center rounded-full border border-[#184536]/15 bg-white text-[#184536] shadow-md transition-transform duration-150 hover:scale-105 active:scale-95"
                >
                  <img
                    src="/assets/shuffle.svg"
                    alt=""
                    aria-hidden="true"
                    class="h-5 w-5"
                  />
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
