<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omkarlohar.me</title>
  </head>
  <body class="bg-white">
    <div class="w-full relative bg-white">
      <div data-barba="wrapper" class="w-full relative">
        <div class="loading-container">
          <div class="loading-screen">
            <div class="rounded-div-wrap top">
              <div class="rounded-div"></div>
            </div>
            <div class="rounded-div-wrap bottom">
              <div class="rounded-div"></div>
            </div>
            <div class="loading-words">
               <h2 class="greeting greeting-first">Hello</h2>
              <h2 class="greeting">Bonjour</h2>
              <h2 class="greeting">Hola</h2>
              <h2 class="greeting">Ciao</h2>
              <h2 class="greeting">Olá</h2>
              <h2 class="greeting">こんにちは</h2>
              <!-- <h2 class="greeting">Hallå</h2> -->
              <!-- <h2 class="greeting">Guten tag</h2> -->
              <!-- <h2 class="greeting">வணக்கம்</h2>
              <h2 class="greeting">నమస్కారం</h2> -->
              <h2 class="greeting">നമസ്കാരം</h2>
              <!-- <h2 class="greeting">নমস্কাৰ</h2> -->
              <h2 class="greeting">ನಮಸ್ಕಾರ</h2>
              <h2 class="greeting-last">नमस्कार</h2>
              <h2 class="page-word"></h2>
            </div>
          </div>
        </div>
        <div data-barba="container" data-barba-namespace="home" class="w-full">
          <div data-scroll-container>
            <header class="home-header" data-scroll-section>
              <div class="personal-image" data-scroll data-scroll-speed="-3" data-scroll-position="top">
                <img src="/assets/setup_1.jpeg" alt="My setup" />
              </div>
              <div class="big-name">
                <div class="name-h1" data-scroll data-scroll-direction="horizontal" data-scroll-speed="4" data-scroll-position="top">
                  <div class="name-wrap">
                    <h1 class="no-select">This is my setup<span class="spacer">—</span></h1>
                  </div>
                </div>
              </div>
            </header>
            <section
              data-scroll-section
              class="bg-white w-full min-h-screen flex flex-col items-center justify-center gap-8 px-4 text-center"
            >
              <h2 class="text-black text-3xl sm:text-5xl font-semibold max-w-2xl">
                Want to see what I've been building?
              </h2>
              <a
                href="/projects/"
                class="px-6 py-3 rounded-full text-lg text-black border border-gray-700 hover:border-gray-500 transition-colors duration-300"
              >
                View My Projects
              </a>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
