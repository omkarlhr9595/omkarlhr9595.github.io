<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omkarlohar.me</title>
    <script type="module" crossorigin src="/assets/main-op8S-srt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-DErCOOYj.css">
  </head>
  <body class="bg-white">
    <div class="relative w-full bg-white">
      <div data-barba="wrapper" class="relative w-full">
        <div class="loading-container pointer-events-none fixed inset-0 z-[999] overflow-hidden">
          <div class="loading-screen relative top-full h-full w-full bg-black [will-change:top]">
            <div
              class="rounded-div-wrap top absolute left-0 top-0 h-0 w-full -translate-y-full -scale-y-100 overflow-hidden [will-change:height]"
            >
              <div
                class="rounded-div absolute left-1/2 top-0 h-[745%] w-[150%] -translate-x-1/2 translate-y-[-86.666%] rounded-full bg-black"
              ></div>
            </div>
            <div
              class="rounded-div-wrap bottom absolute bottom-0 left-0 h-0 w-full translate-y-full overflow-hidden [will-change:height]"
            >
              <div
                class="rounded-div absolute left-1/2 top-0 h-[745%] w-[150%] -translate-x-1/2 translate-y-[-86.666%] rounded-full bg-black"
              ></div>
            </div>
            <div
              class="loading-words absolute left-1/2 top-1/2 z-[3] w-full -translate-x-1/2 -translate-y-1/2 opacity-0 [will-change:opacity]"
            >
              <h2
                class="greeting greeting-first absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white opacity-100"
              >
                Hello
              </h2>
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                Bonjour
              </h2>
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                Hola
              </h2>
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                Ciao
              </h2>
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                Olá
              </h2>
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                こんにちは
              </h2>
              <!-- <h2 class="greeting">Hallå</h2> -->
              <!-- <h2 class="greeting">Guten tag</h2> -->
              <!-- <h2 class="greeting">வணக்கம்</h2>
              <h2 class="greeting">నమస్కారం</h2> -->
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                നമസ്കാരം
              </h2>
              <!-- <h2 class="greeting">নমস্কাৰ</h2> -->
              <h2
                class="greeting absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                ನಮಸ್ಕಾರ
              </h2>
              <h2
                class="greeting-last absolute left-0 top-0 m-0 hidden w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              >
                नमस्कार
              </h2>
              <h2
                class="page-word absolute left-0 top-0 m-0 block w-full whitespace-nowrap text-center font-greeting text-[clamp(1.75rem,4vw,3rem)] font-medium text-white"
              ></h2>
            </div>
          </div>
        </div>
        <div data-barba="container" data-barba-namespace="home" class="w-full">
          <div data-nav-overlay></div>
          <div data-scroll-container>
            <header
              class="home-header relative flex min-h-[115vh] items-center overflow-hidden bg-black max-[720px]:max-h-[110vh] max-[720px]:min-h-[110vh]"
              data-scroll-section
            >
              <div class="absolute left-0 top-0 z-20 w-full" data-nav-bar></div>
              <div
                class="personal-image once-in absolute left-0 top-[-10%] h-[110%] w-full bg-black [will-change:transform] max-[720px]:top-[-5%] max-[720px]:h-[105%]"
                data-scroll
                data-scroll-speed="-3"
                data-scroll-position="top"
              >
                <picture>
                  <source media="(max-width: 720px)" srcset="/assets/setup_2.png" />
                  <img
                    class="absolute left-1/2 h-full w-auto -translate-x-1/2 object-cover max-[720px]:w-full"
                    src="/assets/setup_1.png"
                    alt="My setup"
                  />
                </picture>
              </div>
              <div
                class="big-name absolute bottom-[15vh] left-0 w-full pb-[clamp(1.875em,5vw,3.125em)] max-[720px]:bottom-[33vh]"
              >
                <div
                  class="name-h1 relative flex w-full"
                  data-scroll
                  data-scroll-direction="horizontal"
                  data-scroll-speed="4"
                  data-scroll-position="top"
                >
                  <div class="name-wrap relative flex items-center">
                    <h1
                      class="no-select once-in pointer-events-none relative m-0 flex items-center whitespace-nowrap p-0 font-heading text-[max(9em,15vw)] font-semibold leading-none text-white [text-shadow:4px_4px_20px_rgba(0,0,0,0.5)] [will-change:transform]"
                    >
                      This is my setup<span class="spacer px-[3vw]">—</span>
                    </h1>
                  </div>
                </div>
              </div>
            </header>
            <section
              data-scroll-section
              class="flex min-h-screen w-full items-center justify-center bg-white px-3 py-6 sm:p-10 lg:p-16"
            >
              <!-- The aspect ratio lives on the wrapper, not on the loaded image:
                   Locomotive measures section offsets once at init, so a box that
                   only gets its height once the SVG lands leaves those offsets
                   stale and sections get flagged out-of-view. -->
              <div class="relative aspect-[772/472] w-[min(100%,1800px,calc(66vh*1.6356))]">
                <img
                  src="/assets/desk-mat.svg"
                  alt=""
                  aria-hidden="true"
                  class="pointer-events-none absolute inset-0 block h-full w-full select-none drop-shadow-[0_25px_50px_rgba(0,0,0,0.28)]"
                />
                <div class="absolute inset-0 overflow-hidden" data-draggable-layer>
                  <!-- Position and tilt are randomised per load in
                       initDraggables(); add more items by copying this block. -->
                  <div class="draggable absolute w-12 select-none sm:w-16 md:w-20">
                    <img
                      src="/assets/coke.png"
                      alt=""
                      draggable="false"
                      class="draggable-image block h-full w-full cursor-grab touch-none active:cursor-grabbing"
                    />
                    <div class="group/rotate absolute bottom-0 right-0 h-1/4 w-1/4">
                      <button
                        type="button"
                        aria-label="Rotate"
                        class="draggable-rotate absolute -bottom-1.5 -right-1.5 flex h-5 w-5 cursor-grab touch-none items-center justify-center rounded-full border border-black/10 bg-white/90 text-[#184536] opacity-0 shadow transition-opacity duration-150 focus-visible:opacity-100 active:cursor-grabbing active:opacity-100 group-hover/rotate:opacity-100"
                      >
                        <svg
                          viewBox="0 0 16 16"
                          class="h-3 w-3"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                        >
                          <path
                            d="M12.5 8a4.5 4.5 0 1 1-1.5-3.354"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          />
                          <path d="M11 2v3h-3" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>
                <div
                  class="pointer-events-none absolute inset-0 flex items-center justify-center px-[10%]"
                  data-ransom-title
                >
                  <img
                    data-letter="D"
                    alt="D"
                    class="ransom-letter aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="e"
                    alt="e"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="s"
                    alt="s"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="k"
                    alt="k"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <span class="w-[3%] shrink-0" aria-hidden="true"></span>
                  <img
                    data-letter="S"
                    alt="S"
                    class="ransom-letter aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="e"
                    alt="e"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="t"
                    alt="t"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="u"
                    alt="u"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                  <img
                    data-letter="p"
                    alt="p"
                    class="ransom-letter -ml-[2%] aspect-square min-w-0 flex-1 select-none drop-shadow-[0_4px_8px_rgba(0,0,0,0.35)]"
                  />
                </div>
                <span class="sr-only">Desk Setup</span>
                <button
                  type="button"
                  aria-label="Shuffle letters and stickers"
                  data-ransom-shuffle
                  class="absolute -bottom-14 right-0 flex h-10 w-10 items-center justify-center rounded-full border border-[#184536]/15 bg-white text-[#184536] shadow-md transition-transform duration-150 hover:scale-105 active:scale-95"
                >
                  <img src="/assets/shuffle.svg" alt="" aria-hidden="true" class="h-5 w-5" />
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
