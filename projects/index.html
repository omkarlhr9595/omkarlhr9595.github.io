<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects · omkarlohar.me</title>
  </head>
  <body class="bg-white">
    <div class="min-h-screen w-full relative bg-white">
      <div data-barba="wrapper" class="w-full min-h-screen relative">
        <div class="loading-container">
          <div class="loading-screen">
            <div class="rounded-div-wrap top">
              <div class="rounded-div"></div>
            </div>
            <div class="rounded-div-wrap bottom">
              <div class="rounded-div"></div>
            </div>
            <div class="loading-words">
              <h2></h2>
            </div>
          </div>
        </div>
        <div data-barba="container" data-barba-namespace="projects" class="w-full">
          <div class="container mx-auto px-4 py-12 max-w-6xl">
            <div class="flex justify-between items-center mb-12">
              <h1 class="text-4xl font-bold text-black font-body">My Projects</h1>
              <a
                href="/"
                class="border border-gray-700 hover:border-gray-500 text-black px-6 py-2 rounded-full transition-colors duration-300 font-body opacity-0 animate-[fadeIn_0.7s_ease-out_0.5s_forwards]"

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              <div class="bg-[#222] rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300 flex flex-col h-full opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]">
                <h3 class="text-xl font-bold mb-2 text-white">Smash Error</h3>
                <p class="text-gray-400 mb-4 flex-grow">
                  A full-stack e-commerce application with payment integration
                </p>
                <a
                  href="https://github.com/omkarlhr9595/SmashError"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="text-[#FAFAFC] hover:text-gray-300 font-medium font-body"

              </div>
              <div class="bg-[#222] rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300 flex flex-col h-full opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]">
                <h3 class="text-xl font-bold mb-2 text-white">Portfolio Website</h3>
                <p class="text-gray-400 mb-4 flex-grow">
                  Personal portfolio built with Vite, TypeScript, Tailwind CSS and Barba.js
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
